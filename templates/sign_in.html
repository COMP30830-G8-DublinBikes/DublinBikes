<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account – G8BikeShare</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <div class="page-shell">

    <nav class="g8-nav">
      <a class="g8-brand" href="{{ url_for('home') }}">
        <div class="g8-brand-mark">
          <svg viewBox="0 0 22 22" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="15.5" r="3"/><circle cx="16.5" cy="15.5" r="3"/><path d="M5.5 15.5L8.5 8L12 15.5H16.5"/><path d="M8.5 8H14"/></svg>
        </div>
        <div class="g8-brand-text">
          <span class="g8-brand-name"><span class="g8-brand-accent">G8</span>BikeShare</span>
        </div>
      </a>

      <div class="g8-nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Find a Bike</a> 
        <a href="{{ url_for('journey_planner') }}">Journey</a>
        <a href="{{ url_for('weather_page') }}">Weather</a>
        <a href="{{ url_for('about') }}">About</a>
      </div>

      <div class="g8-nav-actions">        
        <a href="{{ url_for('sign_in') }}" class="nav-signin-link" id="navSignInLink">Sign In</a>

        <div class="nav-avatar-wrap">
          <button class="nav-avatar-btn" id="navAvatarBtn">
            <span class="nav-avatar-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"></path><circle cx="12" cy="8" r="4"></circle></svg>
            </span>
          </button>
          
          <div class="nav-avatar-menu" id="navAvatarMenu">
            <div class="nav-avatar-user">
              <strong id="navAvatarUsername">Guest</strong>
              <span id="navAvatarSubtext">Not signed in</span>
            </div>
            <a href="{{ url_for('home') }}" class="nav-avatar-link">Back to Home</a>
            <button class="nav-avatar-action hidden" id="navLogoutBtn">Log Out</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="auth-layout">
      <section class="auth-card">
        <div class="auth-switch">
          <button id="modeLoginBtn" class="active" type="button">Sign in</button>
          <button id="modeRegisterBtn" type="button">Sign up</button>
        </div>

        <h2 id="formTitle">Sign in</h2>
        <p class="subtext" id="formSubtitle">Enter your username and password to sign in.</p>

        <form id="authForm">
          <div class="form-group">
            <label class="form-label" for="usernameInput">Username</label>
            <input id="usernameInput" class="form-input" name="username" type="text" placeholder="e.g. hardy" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="passwordInput">Password</label>
            <input id="passwordInput" class="form-input" name="password" type="password" placeholder="At least 6 characters" required />
          </div>

          <div class="form-group hidden" id="confirmPasswordGroup">
            <label class="form-label" for="confirmPasswordInput">Confirm password</label>
            <input id="confirmPasswordInput" class="form-input" type="password" placeholder="Repeat your password" />
          </div>

          <button class="primary-submit" id="submitBtn" type="submit">Sign in</button>
        </form>

        <div id="messageBox" class="message-box"></div>
      </section>
    </div>
  </div>

  <script>
    let currentMode = "login";

    const modeLoginBtn = document.getElementById("modeLoginBtn");
    const modeRegisterBtn = document.getElementById("modeRegisterBtn");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const authForm = document.getElementById("authForm");
    const submitBtn = document.getElementById("submitBtn");
    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");
    const confirmPasswordGroup = document.getElementById("confirmPasswordGroup");
    const confirmPasswordInput = document.getElementById("confirmPasswordInput");
    const messageBox = document.getElementById("messageBox");

    document.addEventListener("DOMContentLoaded", () => {
      setupModeSwitch();
      setupFormSubmit();
    });

    function setupModeSwitch() {
      modeLoginBtn.addEventListener("click", () => setMode("login"));
      modeRegisterBtn.addEventListener("click", () => setMode("register"));
    }

    function setMode(mode) {
      currentMode = mode;
      clearMessage();
      if (mode === "login") {
        modeLoginBtn.classList.add("active");
        modeRegisterBtn.classList.remove("active");
        formTitle.textContent = "Sign in";
        formSubtitle.textContent = "Enter your username and password to sign in.";
        submitBtn.textContent = "Sign in";
        confirmPasswordGroup.classList.add("hidden");
        confirmPasswordInput.value = "";
      } else {
        modeRegisterBtn.classList.add("active");
        modeLoginBtn.classList.remove("active");
        formTitle.textContent = "Sign up";
        formSubtitle.textContent = "Create a new account using a username and password.";
        submitBtn.textContent = "Create account";
        confirmPasswordGroup.classList.remove("hidden");
      }
    }

    function setupFormSubmit() {
      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (currentMode === "register") {
          if (password.length < 6) {
            showMessage("Password must be at least 6 characters.", "error");
            return;
          }
          if (password !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
          }
        }

        const endpoint = currentMode === "login" ? "/api/auth/login" : "/api/auth/register";

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = "Processing...";

          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });

          const result = await response.json();

          if (!result.ok) {
            showMessage(result.error || "Authentication failed.", "error");
            return;
          }

          showMessage(result.message || "Success! Redirecting...", "success");
          
          // 登入成功後，重新導向到 Find a Bike (Dashboard)
          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 800);

        } catch {
          showMessage("Request failed. Please try again.", "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = currentMode === "login" ? "Sign in" : "Create account";
        }
      });
    }

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = `message-box ${type}`;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message-box";
    }
  </script>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
