name: Crawler Demo Action
run-name: Crawler Demo Action

# 觸發此 action 的時機
on:
  schedule:
    - cron: "*/5 * * * *"  # 每 5 分鐘執行一次
  workflow_dispatch:  # 可以手動執行此 action

# 預先定義此 action 要幹嘛
jobs:
  crawler-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install Python Dependency
        run: pip install -r requirements.txt
      
      - name: Run crawler.py
        env:
          API_KEY: ${{ secrets.BIKE_API_KEY }}
          CONTRACT_NAME: ${{ secrets.BIKE_CONTRACT_NAME }}  # ← 新增這行
          DB_HOST: ${{ secrets.BIKE_DB_HOST }}
          DB_PORT: ${{ secrets.BIKE_DB_PORT }}
          DB_USER: ${{ secrets.BIKE_DB_USER }}
          DB_PASSWORD: ${{ secrets.BIKE_DB_PASSWORD }}
          DB_NAME: ${{ secrets.BIKE_DB_NAME }}
        run: python crawler.py
