name: Crawler Demo Action
run-name: Crawler Demo Action

# 觸發此 action 的時機
on:
  schedule:
    - cron: "*/5 * * * *"  # 每 5 分鐘執行一次
  workflow_dispatch:  # 可以手動執行此 action

# 預先定義此 action 要幹嘛
jobs:
  crawler-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install Python Dependency
        run: pip install -r requirements.txt  # 改用 requirements.txt
      
      - name: Run crawler.py  #Lily的檔案名稱
        env:
          API_KEY: ${{ secrets.bike.API_KEY }}
          DB_HOST: ${{ secrets.bike.DB_HOST }}
          DB_USER: ${{ secrets.bike.DB_USER }}
          DB_PASSWORD: ${{ secrets.bike.DB_PASSWORD }}
          DB_PORT: ${{ secrets.bike.DB_PORT }}  # Aiven 需要指定 port
        run: python crawler.py #Lily的檔案名稱
